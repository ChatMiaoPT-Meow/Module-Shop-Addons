    side="BOTH"

[[dependencies.module_shop_redpacket]]
    modId="module_shop"
    type="required"
    versionRange="[1.0.3,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.module_shop_redpacket]]
    modId="atomlib"
