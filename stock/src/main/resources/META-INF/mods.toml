modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"

[[mods]]
modId="module_shop_stock"
version="${mod_version}"
displayName="Module-Shop Stock Market ${mod_version} for Forge ${minecraft_version}"
authors="ChatMiaoPT-Meow"
description='''
模组商店附属：虚拟股市（Forge 1.20.1）。
股票定义存在存档里，管理员可以在商店界面里直接发行新股、改名、调参、停牌、下架与强制清算；
行情用 OHLCV 柱记录，界面提供 K 线、成交量、指数与自选；交易支持市价与限价委托、手续费与停牌。
资金全部通过模组商店公共 EconomyApi 结算。
'''

[[dependencies.module_shop_stock]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.module_shop_stock]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.module_shop_stock]]
    modId="module_shop"
    mandatory=true
    versionRange="[1.1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.module_shop_stock]]
    modId="atomlib"
    mandatory=true
    versionRange="${atomlib_version_range}"
    ordering="AFTER"
    side="CLIENT"
