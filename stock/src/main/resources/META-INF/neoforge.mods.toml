[[mods]]
modId="module_shop_stock"
version="2.2.0"
displayName="module-shop: Stock market"
authors="Ar_Zhe"
description='''
模组商店附属：虚拟股市。
股票定义存在存档里，管理员可以在商店界面里直接发行新股、改名、调参、停牌、下架与强制清算；
行情用 OHLCV 柱记录，界面提供 K 线、成交量、指数与自选；交易支持市价与限价委托、手续费与停牌。
资金全部通过模组商店公共 EconomyApi 结算。
'''

[[dependencies.module_shop_stock]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,21.2)"
    ordering="NONE"
    side="BOTH"

[[dependencies.module_shop_stock]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1]"
    ordering="NONE"
    side="BOTH"

[[dependencies.module_shop_stock]]
    modId="module_shop"
    type="required"
    versionRange="[1.0.3,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.module_shop_stock]]
    modId="atomlib"
    type="required"
    versionRange="[0.1.0-beta,)"
    ordering="AFTER"
    side="CLIENT"
    reason="股市内容页使用与模组商店一致的 AtomLib 绘制；不可用时提供原版回退界面。"
