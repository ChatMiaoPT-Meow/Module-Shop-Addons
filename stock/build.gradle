plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.24'
}

version = "${mod_version}-forge-${minecraft_version}"
group = 'cn.autoforged.module_shop_stock'

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    flatDir { dirs 'libs' }
}

// ===================== AtomLib（客户端 UI 前置） =====================
// 使用 libs/atomlib-1.20.1-forge-0.4.0.jar 离线校验并解出 Skija / humbleui types 供 javac 编译。
def atomlibJar = layout.projectDirectory.file("libs/atomlib-1.20.1-forge-${atomlib_version}.jar")
def atomlibSha256 = project.property('atomlib_jar_sha256').toString()
def skijaJar = layout.buildDirectory.file('atomlib-compile/skija-shared-0.143.18.jar')
def skijaTypesJar = layout.buildDirectory.file('atomlib-compile/types-0.2.0.jar')

def verifyAtomLibPin = tasks.register('verifyAtomLibPin') {
    inputs.file(atomlibJar)
    inputs.property('sha256', atomlibSha256)
    def stamp = layout.buildDirectory.file('atomlib-compile/atomlib.sha256')
    outputs.file(stamp)
    doLast {
        def source = inputs.files.singleFile
        if (!source.isFile()) {
            throw new GradleException("找不到 AtomLib jar：${source}")
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        source.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = stream.read(buffer)) > 0) {
                digest.update(buffer, 0, read)
            }
        }
        def actual = digest.digest().collect { String.format('%02x', it & 0xff) }.join('')
        if (actual != atomlibSha256) {
            throw new GradleException("AtomLib pin mismatch: expected ${atomlibSha256} but was ${actual}")
        }
        def out = stamp.get().asFile
        out.parentFile.mkdirs()
        out.text = actual + '\n'
    }
}

def extractAtomSkija = tasks.register('extractAtomSkija') {
    dependsOn verifyAtomLibPin
    inputs.file(atomlibJar)
    def nested = ['skija-shared-0.143.18.jar': skijaJar, 'types-0.2.0.jar': skijaTypesJar]
    outputs.files(nested.values())
    doLast {
        def source = inputs.files.singleFile
        new java.util.zip.ZipFile(source).withCloseable { zip ->
            nested.each { name, target ->
                def dest = target.get().asFile
                dest.parentFile.mkdirs()
                def entry = zip.getEntry('META-INF/jarjar/' + name)
                if (entry == null) {
                    throw new GradleException('Pinned AtomLib jar is missing META-INF/jarjar/' + name)
                }
                zip.getInputStream(entry).withCloseable { input ->
                    dest.withOutputStream { output -> output << input }
                }
            }
        }
    }
}

tasks.named('check').configure { dependsOn verifyAtomLibPin }

// ===================== 模块商店依赖 =====================
// 只编译公共 API jar；完整主体仅供本地运行，不打包进附属。
def shopApiVersion = "${module_shop_version}-forge-${minecraft_version}"
def pick = { String key, String fallback -> (project.findProperty(key) ?: fallback).toString() }
def shopRootProp = project.findProperty('module_shop_root')
def shopLibs = shopRootProp ? new File(file(shopRootProp.toString()), 'build/libs') : file('libs')
def shopApiJar = pick('module_shop_api_jar', new File(shopLibs, "module_shop-${shopApiVersion}-api.jar").path)
def shopJar = pick('module_shop_jar', new File(shopLibs, "Module-Shop-${module_shop_version}-for-Forge-${minecraft_version}.jar").path)

tasks.named('compileJava').configure {
    dependsOn verifyAtomLibPin, extractAtomSkija
    def apiJar = shopApiJar
    doFirst {
        if (!new File(apiJar).isFile()) {
            throw new GradleException("找不到模组商店公共 API jar：${apiJar}\n" +
                    "请把 module_shop-${shopApiVersion}-api.jar 放进 libs/，或用 -Pmodule_shop_root=<模块商店 1.20.1 目录> 指向已构建的主仓库。")
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly files(shopApiJar)
    compileOnly fg.deobf("local:atomlib-1.20.1-forge:${atomlib_version}")
    compileOnly files(skijaJar, skijaTypesJar)

    if (new File(shopJar).isFile()) {
        runtimeOnly fg.deobf(files(shopJar))
    }
    runtimeOnly fg.deobf("local:atomlib-1.20.1-forge:${atomlib_version}")

    // 价格模型 v3 的纯 Java 核心单测（不依赖 Minecraft 类）
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_version            : mod_version,
            module_shop_version    : module_shop_version,
            atomlib_version_range  : atomlib_version_range
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "Module-Shop-Stock-${mod_version}-for-Forge-${minecraft_version}.jar"
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// 兼容 Windows 中文（非 ASCII）项目路径运行 JUnit 5 测试（规避 JVM @argfile 系统编码乱码导致的 ClassNotFoundException）
def nonAsciiProjectPath = !projectDir.path.chars().allMatch { it < 128 }
def asciiSafeRoot = new File(System.getProperty('java.io.tmpdir'), 'ms-stock-1201-junit-safe')
def syncMainForTest = tasks.register('syncMainClassesForTest', Sync) {
    onlyIf { nonAsciiProjectPath }
    from sourceSets.main.output.classesDirs
    into new File(asciiSafeRoot, 'main-classes')
}
def syncMainResourcesForTest = tasks.register('syncMainResourcesForTest', Sync) {
    onlyIf { nonAsciiProjectPath }
    from tasks.named('processResources')
    into new File(asciiSafeRoot, 'main-resources')
}
def syncTestClasses = tasks.register('syncTestClassesForTest', Sync) {
    onlyIf { nonAsciiProjectPath }
    from sourceSets.test.output.classesDirs
    into new File(asciiSafeRoot, 'test-classes')
}
def syncExtraJarsForTest = tasks.register('syncExtraJarsForTest', Sync) {
    onlyIf { nonAsciiProjectPath }
    from sourceSets.test.runtimeClasspath.filter { File f ->
        f.isFile() && !f.path.chars().allMatch { it < 128 }
    }
    into new File(asciiSafeRoot, 'extra-jars')
}
def asciiRuntimeDeps = sourceSets.test.runtimeClasspath.filter { File f ->
    f.path.chars().allMatch { it < 128 }
}
def safeTestClasspath = nonAsciiProjectPath
        ? files(new File(asciiSafeRoot, 'test-classes'),
                new File(asciiSafeRoot, 'main-classes'),
                new File(asciiSafeRoot, 'main-resources'),
                asciiRuntimeDeps,
                fileTree(new File(asciiSafeRoot, 'extra-jars')))
        : sourceSets.test.runtimeClasspath

if (nonAsciiProjectPath) {
    tasks.named('test', Test).configure {
        dependsOn syncMainForTest, syncMainResourcesForTest, syncTestClasses, syncExtraJarsForTest
        testClassesDirs = files(new File(asciiSafeRoot, 'test-classes'))
        classpath = safeTestClasspath
        testLogging { events "passed", "failed", "skipped"; showStandardStreams = true }
    }
}

// 打印完整验收统计表：./gradlew.bat simulatePriceModel -Pmodule_shop_root=<主仓库> [-PsimPaths=200]
tasks.register('simulatePriceModel', JavaExec) {
    group = 'verification'
    description = '运行价格模型 v3 统计模拟并打印验收表'
    if (nonAsciiProjectPath) {
        dependsOn syncMainForTest, syncMainResourcesForTest, syncTestClasses, syncExtraJarsForTest
    }
    classpath = safeTestClasspath
    mainClass = 'cn.autoforged.module_shop_stock.market.model.PriceModelSim'
    args = [(project.findProperty('simPaths') ?: '200').toString()]
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dfile.encoding=UTF-8'
}
